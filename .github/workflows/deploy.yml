name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed for actions/deploy-pages to publish and mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway — a cancelled
# Pages deploy can leave the site serving a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Set this in Settings → Secrets and variables → Actions → Variables.
          # Without it the quote and contact forms render their
          # "not connected" notice instead of silently dropping leads.
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
        run: npm run build

      - name: Verify the build produced what we expect
        run: |
          pages=$(find dist -name '*.html' | wc -l)
          echo "built $pages pages"
          test "$pages" -gt 100 || { echo "::error::only $pages pages built, expected 130+"; exit 1; }
          test -f dist/CNAME || { echo "::error::CNAME missing — custom domain would be dropped"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::sitemap.xml missing"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
