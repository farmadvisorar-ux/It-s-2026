name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing by pushing the built site to the gh-pages branch, which works with
# the "Deploy from a branch" Pages source. The actions/deploy-pages route needs
# the source set to "GitHub Actions", which is not available on this account.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Set in Settings → Secrets and variables → Actions → Variables.
          # Until it exists the forms show their "not connected" notice rather
          # than silently dropping enquiries.
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
        run: npm run build

      - name: Verify the build before publishing
        run: |
          pages=$(find dist -name '*.html' | wc -l)
          echo "built $pages pages"
          test "$pages" -gt 100 || { echo "::error::only $pages pages built, expected 130+"; exit 1; }
          # CNAME: losing it drops the custom domain back to github.io
          test -f dist/CNAME || { echo "::error::dist/CNAME missing"; exit 1; }
          # .nojekyll: without it Pages runs Jekyll, which ignores _astro/ and
          # serves every page with no CSS or JS at all
          test -f dist/.nojekyll || { echo "::error::dist/.nojekyll missing — assets would 404"; exit 1; }
          test -d dist/_astro || { echo "::error::dist/_astro missing"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::sitemap.xml missing"; exit 1; }
          echo "CNAME=$(cat dist/CNAME) assets=$(find dist/_astro -type f | wc -l)"

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          # Force-push: gh-pages holds build output only, so its history is
          # disposable and a fresh tree each time avoids stale files lingering.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
