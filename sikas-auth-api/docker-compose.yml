version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sikas_auth_postgres
    environment:
      POSTGRES_DB: sikas_auth
      POSTGRES_USER: sikas_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sikas_admin -d sikas_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sikas_auth_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-api:
    build: .
    container_name: sikas_auth_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sikas_admin:password123@postgres:5432/sikas_auth
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key_change_in_production
      NODE_ENV: development
      PORT: 9000
    ports:
      - "9000:9000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
